experiment:
  id: EXP_001_C3_C4
  feeder: Rede34Barras/ieee34Mod3ORIGINAL.dss
  steps: 24
  dt_h: 1.0
  voltage_upper_pu: 1.05
  voltage_lower_pu: 0.95
  tolerance_pu: 0.0001

network:
  voltage_bases_kv: [69, 24.9, 14.376, 4.16]

pv:
  buses: [824pv, 816pv, 828pv, 830pv]
  pmpp_kw: [1200, 600, 400, 200]
  # Define inverter_kva explicitly before running C4.
  inverter_kva: null

bess:
  buses: [824pv, 816pv, 828pv, 830pv]
  kw_rated: [800, 800, 800, 800]
  kwh_rated: [4000, 4000, 4000, 4000]
  soc_initial: null
  soc_min: null
  soc_max: null
  eta_charge: null
  eta_discharge: null
  allow_discharge: false

consensus:
  method: current_leader_follower_export_target
  leader_index: 0
  graph: complete
  epsilon: 0.25
  gain_kw_per_pu: 10000.0
  max_iterations: 120

cases:
  C3:
    q_pv_enabled: false
    bess_consensus: true
    residual_curtailment: true
  C4:
    q_pv_enabled: true
    q_control_law: null
    bess_consensus: true
    residual_curtailment: true

outputs:
  raw_csv: true
  excel_summary: true
  figures_png: true
  figures_pdf: true
